[project]
name = "w37-reconciliation"
version = "0.3.0"
description = "W37 — réconciliation hiérarchique : MinT(shrink) de zéro, job avec quality gate, mini-projet éCO2mix."
readme = "README.md"
authors = [{ name = "wilson goma" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Épinglées : les chiffres publiés dans les README dépendent de ces versions (cf. 02_mint_from_scratch).
    "hierarchicalforecast==1.5.1",
    "statsforecast==2.1.1",
    "numpy>=2.4,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    # bloc 5 : téléchargement, stockage parquet, tests d'hypothèses
    "requests>=2.31",
    "pyarrow>=15",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.scripts]
w37 = "w37_reconciliation.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/w37_reconciliation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: entraîne des modèles statsforecast (quelques secondes)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
